# ============================================================
# application-test.properties — テスト実行専用の上書き設定（test プロファイル）
# ============================================================
# なぜ「application.properties」ではなく「application-test.properties」なのか：
#   src/test/resources/application.properties を置くと、クラスパス上で
#   src/main/resources/application.properties より先に見つかり、
#   main 側が「上書き」ではなく「まるごと無視」される（DB接続設定等がすべて消える）。
#   プロファイル別ファイル（application-<profile>.properties）なら
#   main の application.properties が土台として読まれた上に重なるので、
#   ここには「テストで変えたい差分」だけを書けばよい。
#
# 使い方：@SpringBootTest を付けたテストクラスに
#   @ActiveProfiles({"demo", "test"}) を指定する。
#   （demo = デモデータ投入、test = このファイル。両方必要）
# ============================================================

# テスト専用のダミー署名鍵。
# 本番/開発が環境変数 JWT_SECRET を要求するのに対し、テストはここに固定値を書く。
# 理由：テストは「いつ・どのマシンで走らせても同じ結果になる」ことが最優先で、
#       実行者の環境変数の設定状況に結果が左右されてはいけない。
# この値はテスト専用であり、実環境では絶対に使わない（32バイト以上必要）。
jwt.secret=test-only-jwt-secret-not-used-in-any-real-environment

# テスト用の DB 接続情報。
# 本体（application.properties）は DB_USERNAME / DB_PASSWORD を必須にしているため、
# ここで固定値を与えないと「.env を置いた開発者のマシンでは通り、CI では起動できない」
# という環境依存のテストになってしまう。jwt.secret と同じ考え方で、テストは
# 実行者の環境変数に左右されず、いつ・どこで走らせても同じ結果になるようにする。
#
# 値は docker-compose.yml が立てる MySQL に合わせてある。
# テストは @SpringBootTest で実DBに接続するため、CI でも同じ資格情報の
# MySQL service container を用意すればそのまま緑になる（コマ16で対応）。
spring.datasource.username=user
spring.datasource.password=password
