spring.application.name=team-flow

# DB 接続先。ホスト/ポート/DB名は「秘密情報ではなく環境ごとの接続先」なので、
# ローカル開発（docker-compose の MySQL）に合わせた既定値を持たせる。
#  ・${DB_HOST:localhost} の「: 以降」が既定値。未設定ならローカルに繋ぎに行く
#  ・コンテナから繋ぐときは DB_HOST=db のようにサービス名を渡せば、コードを変えずに切り替わる
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:team-flow}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo

# DB の認証情報。JWT_SECRET と同じく、あえて既定値を書かない（＝未設定なら起動失敗）。
# 理由は jwt.secret と同じで、既定値があると
#  ・設定を忘れたまま起動してしまい、設定漏れに気づけない
#  ・その資格情報がリポジトリに残り、公開した時点で「DBのユーザー名とパスワード」が公になる
# 接続先（URL）と資格情報（ユーザー/パスワード）で既定値の有無を分けているのは、
# 前者は環境の都合、後者は秘密情報、という性質の違いによる。
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# スキーマ管理は Flyway に完全委任する。Hibernate はスキーマに一切関与しない（none）。
# ※ Spring Boot 4.0.3 では「JPA が Flyway 完了を待つ」順序付けが効かず、validate だと
#   「Flyway 実行前に Hibernate が検証 → テーブル無しで起動失敗」してしまうため none にする。
#   スキーマの正はマイグレーション（db/migration）側。Entity とのズレはテスト/レビューで担保する。
spring.jpa.hibernate.ddl-auto=none
# data.sql（デモデータ投入）は Hibernate 初期化の後に走らせる（テーブル生成後にINSERTするため）
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# Flyway：起動時に classpath:db/migration の V1__, V2__... を順に適用する。
# baseline-on-migrate=true：既にテーブルがあるのに履歴が無いDBでも、そこを起点として扱えるようにする保険。
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ローカル開発用に、プロジェクト直下の .env を設定値として取り込む。
#  ・Spring Boot は .env を自動では読まない（.env は dotenv/Docker 由来の慣習であって Spring の標準ではない）
#    ため、この一行で明示的に読み込ませる。[.properties] は「拡張子は違うが properties 形式として解釈せよ」の指定。
#  ・optional: を付けているので .env が無くてもエラーにならない。
#    本番/コンテナでは .env を置かず、OS 環境変数で直接渡す想定（環境変数の方が優先順位が上）。
#  ・これが無いと「.env を作ったのに起動しない」という分かりにくい状態になる。
spring.config.import=optional:file:./.env[.properties]

# JWT の署名鍵。環境変数 JWT_SECRET から読み込む。
# あえて既定値（${JWT_SECRET:...} の : 以降）を書かない。既定値があると、
#  ・環境変数の設定を忘れても起動してしまい、設定漏れに気づけない
#  ・その既定値がリポジトリに残るため、誰でも任意のユーザーになりすませるトークンを偽造できる
# 未設定なら placeholder の解決に失敗し、起動時点で例外になる（＝早い段階で気づける）。
# 設定例は .env.example を参照。
jwt.secret=${JWT_SECRET}

# CORS で許可するオリジン（フロントエンドの配信元）。カンマ区切りで複数指定できる。
# 既定値をローカルの Vite（http://localhost:5173）にしているのは、設定漏れが「安全側」に倒れるため。
#  ・許可オリジンは秘密情報ではないが、緩めると誰のサイトからでも API を叩かれる穴になる
#  ・逆に狭すぎる場合はフロントから通信できず即座に気づけるので、事故が「動かない」で済む
# つまり DB パスワード（未設定なら起動失敗させたい）とは危険の向きが逆なので、既定値を持たせている。
# 本番/デモ環境では CORS_ALLOWED_ORIGINS に実際のフロントの URL を渡して上書きする。
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 既定で有効にするプロファイル。
#  demo … デモデータ(data-demo.sql)を投入する（ポートフォリオの公開デモは常にデータ入りにしたいので既定を demo に）。
#  本番想定で起動する場合は起動時に --spring.profiles.active=prod を渡せばデモデータは入らない
#  （Flyway のマスタ V1/V2 はどのプロファイルでも常に適用される）。
spring.profiles.active=demo

# 既定ではデモデータを投入しない（never）。
# demo プロファイルのときだけ application-demo.properties が mode=always に上書きして
# data-demo.sql を投入する（prod など他プロファイルでは投入されない）。
spring.sql.init.mode=never

llm.provider=mock