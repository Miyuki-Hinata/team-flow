spring.application.name=team-flow
spring.datasource.url=jdbc:mysql://localhost:3306/team-flow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

jwt.secret=${JWT_SECRET:teamflow-secret-key-must-be-32chars-minimum}

spring.sql.init.mode=always

llm.provider=mock