# ============================================================
# application-demo.properties — demo プロファイル専用の上書き設定
# ============================================================
# demo プロファイルが有効なときだけ、デモ（サンプル）データを投入する。
# 既定(application.properties)は spring.sql.init.mode=never なので、
# prod など他プロファイルではデモデータは入らない（Flyway のマスタ V1/V2 は常に適用）。
# ============================================================

# SQL 初期化を有効化し、投入するスクリプトを data-demo.sql に明示する
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
